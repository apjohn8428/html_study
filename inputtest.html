<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>input 테스트</title>
</head>
<body>
    <h1>회원가입</h1>
    <form>
    
        <table class="inputbox1">
            <tr>
                <td>아이디</td>
                <td>
                    <input type="text" name="memberId">
                </td>
            </tr>
            <tr>
                <td>비밀번호</td>
                <td>
                    <input type="password" name="password">
                </td>
            </tr>
            <tr>
                <td>회원 이름</td>
                <td>
                    <input type="text" name="memberName">
                </td>
            </tr>
            <tr>
                <td>전화 번호</td>
                    <td><input type="text" name="memberPhone">
                </td>
            </tr>
            <tr>
                <td>이메일</td>
                    <td><input type="email" name="memberEmail">
                </td>
            </tr>
            <tr>
                <td>회원주소</td>
                <td>
                    <input type="text" name="memberaddr">
                </td>
            </tr>
            <tr>
                <td>회원 성별</td>
                <td>
                    <input type="radio" name="membergender" value="male">남성
                    <input type="radio" name="membergender" value="female">여성
                </td>
            </tr>
            <tr>
                <td>회원 취미</td>
                <td>
                    <input type="checkbox" name="memberHobby" value="sports">스포츠
                    <input type="checkbox" name="memberHobby" value="reading">독서
                    <input type="checkbox" name="memberHobby" value="movie">영화
                    <input type="checkbox" name="memberHobby" value="game">게임
                </td>
            </tr>
            <tr>
                <td>회원 생일</td>
                <td>
                    <input type="date" name="memberBirth">
                </td>
            </tr>
            <tr>
                <td>자기 소개</td>
                <td>
                    <textarea rows="18" cols="50" placeholder="500자 이내로 작성"></textarea>
                </td>
            </tr>
            <tr>
                <td colspan="2" align="right">
                    <input type="submit" value="가입 완료">
                    <input type="reset" value="초기화">
                </td>
            </tr>
        </table>
        
    </form>
</body>
</html>
