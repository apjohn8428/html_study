<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테이블 연습</title>
</head>
<body>
    <table border="1" cellspacing="0" cellpadding="0" width="400" height="400">
        <tr align="center" bgcolor="yellow">
            <td><font color="red">월</font></td>
            <td>화</td>
            <td>수</td>
        </tr>
        <tr align="center"> <!--해당 줄에 있는 셀들을 가운데 정렬-->
            <td colspan="2">영어</td> <!--병합할 셀의 개수 입력-->
            <!--<td bgcolor="green">수학</td>-->
            <td>국어</td>
        </tr>
        <tr >
            <td align="left">체육</td>
            <td>음악</td>
            <td rowspan="2" valign="bottom">과학</td>
        </tr>
        <tr >
            <td>미술</td>
            <td align="right">수학</td>
            <!--<td>국어</td>-->
        </tr>
    </table>
</body>
</html>
