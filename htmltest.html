<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html 연습</title>
</head>
<body>
    <h1>안녕하세요</h1>
    <h2>안녕하세요</h2>
    <h3>안녕하세요</h3>
    <h4>안녕하세요</h4>
    <h5>안녕하세요</h5>
    <h6>안녕하세요</h6>
    <hr> <!--수평선 태그-->
    <p>html 문단 공부를 시작합니다</p>
    <strong>중요한 내용</strong> <!--강조 의미-->
    줄바꿈<br> <em>공부를</em><br> 시작합니다 <!--강조 의미-->
    <hr>
    <p><b>굵은 글자</b></p> <!--글자를 굵게 표시-->
    <p><i>기울어진 글자</i></p> <!--이탤릭체-->
    <p><u>밑줄이 있는 글자</u></p> <!--밑줄 표시-->
    <p><del>삭제된 내용 표시</del></p> <!--취소선 표시-->
    <p><mark>형광펜 글씨 효과</mark></p> <!--형광펜 강조-->
</body>
</html>
